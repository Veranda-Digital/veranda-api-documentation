name: Tag contract release

on:
  workflow_run:
    workflows: ["Validate OpenAPI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create contract tag from OpenAPI version
        id: tag
        run: node .github/scripts/create-contract-tag.mjs

  bump-consumers:
    needs: tag
    if: ${{ needs.tag.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: Veranda-Digital/veranda-serverless-backend
            base: master
          - repository: Veranda-Digital/VerandaApp
            base: main
    steps:
      - name: Bump contract submodule
        id: bump
        env:
          GH_TOKEN: ${{ secrets.CONTRACT_CONSUMER_BUMP_TOKEN }}
          TAG_NAME: ${{ needs.tag.outputs.tag_name }}
          REPOSITORY: ${{ matrix.repository }}
          BASE_BRANCH: ${{ matrix.base }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CONTRACT_CONSUMER_BUMP_TOKEN not set; skipping consumer bump PRs."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh auth setup-git
          gh repo clone "$REPOSITORY" consumer -- -b "$BASE_BRANCH" --depth 1
          cd consumer

          if ! grep -q 'path = contract' .gitmodules 2>/dev/null; then
            echo "No contract/ submodule in $REPOSITORY; skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git submodule update --init contract
          cd contract
          git fetch --tags origin
          git checkout "$TAG_NAME"
          cd ..

          BRANCH="chore/bump-contract-${TAG_NAME}"
          git checkout -b "$BRANCH"
          git add contract
          if git diff --staged --quiet; then
            echo "contract/ already at $TAG_NAME"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump contract submodule to ${TAG_NAME}"
          git push origin "$BRANCH"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.bump.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.CONTRACT_CONSUMER_BUMP_TOKEN }}
          TAG_NAME: ${{ needs.tag.outputs.tag_name }}
          REPOSITORY: ${{ matrix.repository }}
          BASE_BRANCH: ${{ matrix.base }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          gh pr create \
            --repo "$REPOSITORY" \
            --head "$BRANCH" \
            --base "$BASE_BRANCH" \
            --title "Bump contract to ${TAG_NAME}" \
            --body "Automated bump after [${TAG_NAME}](https://github.com/Veranda-Digital/veranda-api-documentation/releases/tag/${TAG_NAME}) on veranda-api-documentation."
